{% extends 'main/base.html' %}
{% load crispy_forms_tags %}



{% block breadcrumb_item %}
<li class="breadcrumb-item"><a href="{% url 'horariu_list' %}">Horariu</a></li>
<li class="breadcrumb-item"><a href="{% url 'loron_list' %}">Loron</a></li>
<li class="breadcrumb-item active">{% if object %}Hadia{% else %}Aumenta{% endif %}</li>
{% endblock breadcrumb_item %}
{% block contents %}
<div class="card">
    <div class="card-header">
        <h3 class="card-title">{{ title }}</h3>
    </div>
    <div class="card-body">
        {% crispy form %}
    </div>
</div>
{% endblock %}
