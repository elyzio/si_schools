{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SI ESGP{% endblock title %}</title>

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="{% static 'plugins/fontawesome-free/css/all.min.css' %}">
  <!-- icheck bootstrap -->
  <link rel="stylesheet" href="{% static 'plugins/icheck-bootstrap/icheck-bootstrap.min.css' %}">
  <!-- Theme style -->
  <link rel="stylesheet" href="{% static 'dist/css/adminlte.min.css' %}">
  <!-- Auth page styles -->
  <link rel="stylesheet" href="{% static 'css/login.css' %}">

  {% block extra_css %}{% endblock extra_css %}
</head>

<body class="hold-transition">
  <div class="login-page-wrapper container-fluid">
    <!-- Left side with branding -->
    <div class="login-left-side">
      <div class="login-background-overlay"></div>
      <div class="login-branding">
        <img src="{% static 'img/logo_esgp.webp' %}" alt="Logo" class="login-logo-img">
        <h1 class="login-title">SI ESGP</h1>
        <p class="login-subtitle">SISTEMA INFORMASAUN ACADEMIKA</p>
        <div class="login-decorative-elements">
          <div class="floating-element element-1"></div>
          <div class="floating-element element-2"></div>
          <div class="floating-element element-3"></div>
        </div>
      </div>
    </div>

    <!-- Right side with content -->
    <div class="login-right-side">
      <div class="login-form-container">
        {% block contents %}
        {% endblock contents %}

        <div class="login-footer">
          <p class="copyright-text">&copy; 2024 SI ESGP 1912 Same Manufahi</p>
        </div>
      </div>
    </div>
  </div>

  <!-- jQuery -->
  <script src="{% static 'plugins/jquery/jquery.min.js' %}"></script>
  <!-- Bootstrap 4 -->
  <script src="{% static 'plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <!-- AdminLTE App -->
  <script src="{% static 'dist/js/adminlte.min.js' %}"></script>
</body>

</html>
