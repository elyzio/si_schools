{% extends 'auth/base.html' %}
{% load static %}

{% block title %}Logout — SI ESGP{% endblock title %}

{% block contents %}
<div class="logout-content">
  <div class="logout-icon">
    <i class="fas fa-check-circle"></i>
  </div>
  <h2 class="logout-title">Log Out ho Susesu!</h2>
  <p class="logout-message">
    Ita boot sai ona husi sistema ho susesu.<br>
    Obrigadu barak ba ita nia vizita.
  </p>

  <div class="logout-actions">
    <a href="{% url 'login' %}" class="btn-modern-signin">
      <span class="btn-text">Login Fila Fali</span>
      <i class="fas fa-sign-in-alt btn-icon"></i>
    </a>

    <div class="logout-links">
      <a href="{% url 'home' %}" class="logout-link">
        <i class="fas fa-home"></i> Pájina Prinsipál
      </a>
    </div>
  </div>
</div>
{% endblock contents %}
