{% extends 'main/base.html' %}
{% load crispy_forms_tags %}

{% block contents %}
<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">
                    {% if document %}
                        <i class="fas fa-edit"></i> Hadia Dokumentu
                    {% else %}
                        <i class="fas fa-plus"></i> Aumenta Dokumentu
                    {% endif %}
                </h3>
            </div>
            <div class="card-body">
                {% if professor %}
                <div class="alert alert-default-info">
                    <i class="fas fa-user"></i> Profesor: <strong>{{ professor.nome }}</strong>
                </div>
                {% endif %}

                {% crispy form %}
            </div>
        </div>
    </div>
</div>
{% endblock contents %}
