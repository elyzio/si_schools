{% extends 'main/base.html' %}
{% load crispy_forms_tags %}

{% block contents %}
<div class="card">
    <div class="card-header">
        <h3 class="card-title">{{ page_title }}</h3>
        <div class="card-tools">
            <a href="javascript:void(0);" class="btn btn-secondary btn-sm" onclick="history.back();">
                <i class="fas fa-arrow-left"></i> Fila
            </a>
        </div>
    </div>
    <div class="card-body">
        <div class="alert alert-default-info">
            <i class="fas fa-info-circle"></i> Aumenta/Hadia informasaun encaregadu edukasaun ba estudante: <strong>{{ estudante.nome }}</strong>
        </div>

        {% crispy form %}
    </div>
</div>
{% endblock contents %}
